<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJOK SDN 1 PARIGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #bdc3c7 40%, #d4af37 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        body.dark {
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 50%, #4a4a4a 100%);
        }
        @keyframes blink { 50% { opacity: 0.3; } }
        .blink { animation: blink 1.5s linear infinite; }
        .toast { transition: opacity 0.3s; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'charcoal': '#1A1A1A',
                        'light-gold': '#D4AF37',
                        'rich-sea-blue': '#006994',
                        'soft-gray': '#F1F1F1',
                        'darkmode-card': '#252525',
                        'darkmode-text': '#E5E5E5'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-charcoal dark:text-soft-gray transition-colors duration-300 font-sans min-h-screen pb-10">

    <div class="max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 border-b-2 border-light-gold pb-2 bg-white/80 dark:bg-black/40 p-4 rounded-2xl shadow-lg">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <img src="https://i.ibb.co.com/vxKhpF50/6ae92db4-8e81-4a1a-9b35-a218c706dd42-2.png" alt="Logo" class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm">
                <span class="text-charcoal dark:text-white">PJOK</span>
                <span class="text-rich-sea-blue dark:text-blue-400">SDN 1</span>
                <span class="text-light-gold">PARIGI</span>
            </h1>
            <button id="theme-toggle" class="p-2 rounded-xl bg-soft-gray dark:bg-gray-700 text-charcoal dark:text-light-gold transition-all font-bold">
                <span class="block dark:hidden">☀️</span>
                <span class="hidden dark:block">🌙</span>
            </button>
        </header>

        <section class="bg-white/90 dark:bg-darkmode-card p-4 rounded-2xl shadow-sm mb-4 flex items-center gap-4 border border-gray-100 dark:border-gray-700">
            <div id="avatar-container" onclick="changeAvatar()" class="text-4xl cursor-pointer hover:scale-110 transition-transform bg-gray-200 dark:bg-gray-700 p-2 rounded-full w-16 h-16 flex items-center justify-center">
                <span id="avatar">🐸</span>
            </div>
            <div class="flex-1">
                <input id="murid-name" type="text" placeholder="Masukkan Nama Murid" class="w-full bg-transparent font-bold text-lg outline-none border-b border-gray-200 dark:border-gray-600 focus:border-rich-sea-blue dark:text-white">
                <p class="text-[10px] text-gray-500">Klik ikon untuk ganti avatar</p>
            </div>
        </section>

        <!-- Chat AI Section -->
        <section class="mb-6">
            <div id="ai-card" class="bg-[#7CA982] p-5 rounded-[32px] text-white shadow-lg border-2 border-white/20">
                <div class="flex items-center gap-3 mb-3">
                    <img src="https://i.ibb.co.com/vxKhpF50/6ae92db4-8e81-4a1a-9b35-a218c706dd42-2.png" class="w-12 h-12 rounded-full border-2 border-white object-cover" alt="Avatar">
                    <div>
                        <h3 class="font-bold text-lg">Tanya IA Si AGBI</h3>
                        <p class="text-[10px] opacity-90 uppercase tracking-wide">ASISTEN PJOK SDN 1 PARIGI</p>
                    </div>
                </div>
                <button id="start-chat-btn" onclick="openChat()" class="w-full bg-white text-[#7CA982] font-bold py-3 rounded-2xl flex items-center justify-center gap-2 shadow-md hover:bg-gray-100 transition-all">
                    <span>💬 Tanya Si AGBI</span>
                </button>
                <div id="chat-interface" class="hidden mt-4 bg-black/10 p-3 rounded-2xl border border-white/20">
                    <div id="chat-history" class="space-y-4 mb-3 h-48 overflow-y-auto text-sm pr-2 scrollbar-thin">
                        <div class="flex items-start gap-2">
                            <img src="https://i.ibb.co.com/vxKhpF50/6ae92db4-8e81-4a1a-9b35-a218c706dd42-2.png" class="w-8 h-8 rounded-full border-2 border-white">
                            <p class="bg-white/10 p-3 rounded-2xl rounded-tl-none">Halo! Saya Si AGBI, apa yang ingin kamu tanyakan hari ini?</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input id="chat-input" type="text" placeholder="Tulis pertanyaan..." class="flex-1 p-2 rounded-xl text-charcoal outline-none text-sm">
                        <button onclick="sendToGemini()" class="px-4 py-2 bg-white text-[#7CA982] rounded-xl font-bold text-sm">Kirim</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sisa bagian lainnya tetap sama seperti kode asli Anda... -->
        <!-- Pastikan untuk menyalin bagian bawah kode asli Anda di sini -->
    </div>

    <div id="toast-container" class="fixed bottom-4 left-4 right-4 z-50"></div>

    <script>
        // ... (Fungsi changeAvatar, openChat, dll tetap sama)
        
        async function sendToGemini() {
            const input = document.getElementById('chat-input');
            const muridName = document.getElementById('murid-name').value.trim() || "Murid";
            const muridIcon = document.getElementById('avatar').textContent;
            const history = document.getElementById('chat-history');
            const userText = input.value.trim();
            if (!userText) return;
            
            history.innerHTML += `
                <div class="flex items-start gap-2 justify-end">
                    <div class="bg-white text-[#7CA982] p-3 rounded-2xl rounded-tr-none font-bold">
                        <p class="text-[10px] opacity-70">${muridName}</p>
                        <p>${userText}</p>
                    </div>
                    <div class="text-2xl">${muridIcon}</div>
                </div>`;
            input.value = '';

            try {
                // DIUBAH KE ENDPOINT VERCEL
                const response = await fetch('/api/tanya-gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        pesan: userText,
                        namaMurid: muridName 
                    })
                });
                
                const data = await response.json();
                const reply = data.balasan || "Maaf, Si AGBI sedang istirahat.";
                
                history.innerHTML += `
                    <div class="flex items-start gap-2">
                        <img src="https://i.ibb.co.com/vxKhpF50/6ae92db4-8e81-4a1a-9b35-a218c706dd42-2.png" class="w-8 h-8 rounded-full border-2 border-white">
                        <p class="bg-black/10 text-white p-3 rounded-2xl rounded-tl-none">${reply}</p>
                    </div>`;
            } catch (error) {
                history.innerHTML += `<p class="text-left text-xs bg-red-500 text-white p-2 rounded-lg mr-10"><b>Si AGBI:</b> Maaf, koneksi ke server sedang bermasalah.</p>`;
            }
            history.scrollTop = history.scrollHeight;
        }

        // ... (Lanjutkan sisa script asli Anda)
    </script>
</body>
</html>
