<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJOK SDN 1 PARIGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Abril+Fatface&family=VT323&family=Henny+Penny&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Josefin Sans', sans-serif; background: linear-gradient(135deg, #2c3e50 0%, #bdc3c7 40%, #d4af37 100%); min-height: 100vh; }
        .header-custom { background: linear-gradient(180deg, #3D79BA 0%, #E0F6FF 50%, #E5B272 100%); padding: 8px 0; border-bottom-left-radius: 1rem; border-bottom-right-radius: 1rem; }
        .kolom-teks { background: linear-gradient(180deg, #FF5733, #FFC300, #33FF57); padding: 8px 12px; border-radius: 12px; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-charcoal pb-16">
    <header class="header-custom shadow-lg w-full mb-6">
        <div class="max-w-2xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold font-serif">PJOK SDN 1 PARIGI</h1>
            <button id="theme-toggle" class="p-2 bg-white/50 rounded-xl">☀️</button>
        </div>
    </header>

    <div class="max-w-2xl mx-auto p-4">
        <section id="info-app-section" class="kolom-teks hidden mb-4"><div id="info-app-content"></div></section>
        
        <section class="bg-white p-4 rounded-2xl mb-6 flex items-center gap-4">
            <div id="avatar" onclick="changeAvatar()" class="text-4xl cursor-pointer">🐸</div>
            <input id="murid-name" placeholder="Nama Murid" class="w-full bg-transparent outline-none border-b">
        </section>

        <section class="bg-[#7CA982] p-5 rounded-[32px] text-white shadow-lg mb-6">
            <button id="start-chat-btn" onclick="openChat()" class="w-full bg-white text-[#7CA982] font-bold py-3.5 rounded-2xl">💬 Tanya Si AGBI</button>
            <div id="chat-interface" class="hidden mt-4 bg-black/15 p-4 rounded-2xl">
                <div id="chat-history" class="space-y-4 mb-4 h-56 overflow-y-auto pr-2 scrollbar-thin text-sm">
                    <div class="flex items-start gap-2">
                        <p class="bg-white/10 p-3 rounded-2xl">Halo! Apa yang ingin kamu tanyakan hari ini?</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <input id="chat-input" class="flex-1 p-3 rounded-xl text-charcoal outline-none" placeholder="Tanya sesuatu...">
                    <button onclick="sendToGemini()" class="px-5 bg-white text-[#7CA982] rounded-xl font-bold">Kirim</button>
                </div>
            </div>
        </section>

        <div id="schedule-grid" class="grid grid-cols-5 gap-2 mb-6"></div>
        <div id="materiContainer" class="grid grid-cols-2 gap-4"></div>
    </div>

    <script>
        // FUNGSI CHAT KE BACKEND
        async function sendToGemini() {
            const input = document.getElementById('chat-input');
            const history = document.getElementById('chat-history');
            const userText = input.value.trim();
            if (!userText) return;

            history.innerHTML += `<div class="text-right font-bold">${userText}</div>`;
            input.value = '';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                const data = await response.json();
                history.innerHTML += `<div class="bg-black/15 p-3 rounded-2xl">${data.reply || "Error koneksi."}</div>`;
            } catch (e) {
                history.innerHTML += `<div class="text-red-300">Gagal terhubung ke server.</div>`;
            }
            history.scrollTop = history.scrollHeight;
        }

        // FUNGSI PENDUKUNG
        function openChat() { document.getElementById('start-chat-btn').classList.add('hidden'); document.getElementById('chat-interface').classList.remove('hidden'); }
        function changeAvatar() { const av = ['🐸','🐶','🐱','🐹','🐰']; document.getElementById('avatar').textContent = av[Math.floor(Math.random()*av.length)]; }
        document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
        
        // Load data lainnya (tetap sama seperti kode asal Anda)
        async function syncData() {
             // Masukkan kembali kode sinkronisasi Sheet Anda di sini jika diperlukan
        }
        syncData();
    </script>
</body>
</html>
