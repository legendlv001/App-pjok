<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJOK SDN 1 PARIGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Italiana&display=swap');
        
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #bdc3c7 40%, #d4af37 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Josefin Sans', sans-serif;
        }
        body.dark {
            background: linear-gradient(135deg, #121212 0%, #242424 50%, #1a252f 100%);
        }
        
        h1, h2, h3, h4 { font-family: 'Ubuntu', sans-serif !important; }
        .font-soria { font-family: 'Italiana', serif !important; }
        
        .marquee-container { overflow: hidden; width: 100%; }
        .marquee-text { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate(100%, 0); } 100% { transform: translate(-100%, 0); } }
        
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { extend: { colors: { 'charcoal': '#1A1A1A', 'light-gold': '#D4AF37', 'rich-sea-blue': '#006994', 'soft-gray': '#F1F1F1' } } } 
        }
    </script>
</head>
<body class="text-charcoal dark:text-white transition-colors duration-300 min-h-screen pb-16">

    <div class="max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 border-b-4 border-light-gold pb-4 bg-white/80 dark:bg-black/40 backdrop-blur-md p-4 rounded-b-2xl shadow-lg">
            <h1 class="text-2xl font-bold flex items-center gap-3">
                <img src="https://i.ibb.co.com/vxKhpF50/6ae92db4-8e81-4a1a-9b35-a218c706dd42-2.png" alt="Logo" class="w-10 h-10 rounded-full border-2 border-white object-cover shadow-sm">
                <div class="flex flex-row gap-2 text-xl sm:text-2xl font-extrabold tracking-tight underline decoration-light-gold decoration-4 underline-offset-4">
                    <span class="text-charcoal dark:text-white">PJOK</span>
                    <span class="text-rich-sea-blue dark:text-blue-400">SDN 1</span>
                    <span class="text-light-gold">PARIGI</span>
                </div>
            </h1>
            <button id="theme-toggle" class="p-2.5 rounded-xl bg-soft-gray dark:bg-gray-750 text-charcoal dark:text-light-gold transition-all shadow-sm">
                <span class="block dark:hidden">☀️</span><span class="hidden dark:block">🌙</span>
            </button>
        </header>

        <section class="bg-gradient-to-r from-rich-sea-blue to-blue-500 p-5 rounded-2xl shadow-lg mb-6 text-white border-2 border-white/20">
            <h3 class="text-xs uppercase tracking-widest opacity-95 mb-1 font-bold">Motivasi Hari Ini</h3>
            <p id="quote-text" class="font-bold text-base italic"></p>
        </section>

        <section class="bg-white/90 dark:bg-zinc-800 p-4 rounded-2xl shadow-sm mb-6 flex items-center gap-4">
            <div id="avatar-container" onclick="changeAvatar()" class="text-4xl cursor-pointer bg-gray-200 dark:bg-gray-700 p-2 rounded-full w-16 h-16 flex items-center justify-center">
                <span id="avatar">🦋</span>
            </div>
            <div class="flex-1">
                <input id="murid-name" type="text" placeholder="Masukkan Nama Murid" class="w-full bg-transparent font-bold text-lg outline-none border-b border-gray-300 dark:border-gray-600 py-1">
            </div>
        </section>

        <section class="mb-6 space-y-4">
            <div id="ai-card" class="bg-[#7CA982] p-5 rounded-[32px] text-white shadow-lg">
                <button id="start-chat-btn" onclick="openChat()" class="w-full bg-white text-[#7CA982] font-bold py-3.5 rounded-2xl shadow-md">💬 Tanya Si AGBI</button>
                <div id="chat-interface" class="hidden mt-4 bg-black/15 p-4 rounded-2xl">
                    <div id="chat-history" class="space-y-4 mb-4 h-40 overflow-y-auto text-sm scrollbar-thin"></div>
                    <div class="flex gap-2"><input id="chat-input" type="text" class="flex-1 p-3 rounded-xl text-charcoal outline-none text-sm"><button onclick="sendToGemini()" class="px-5 bg-white text-[#7CA982] rounded-xl font-bold">Kirim</button></div>
                </div>
            </div>
        </section>
    </div>

    <footer class="fixed bottom-0 left-0 w-full bg-white/95 dark:bg-black/95 py-2 border-t border-gray-200 dark:border-gray-800 marquee-container font-soria tracking-wider uppercase">
        <div class="marquee-text font-bold text-[8px] sm:text-[10px]">
            📌📢 Aplikasi ini di buat untuk mempermudah dalam mencari dan memahami materi PJOK dan membantu Guru PJOK dalam memberikan tugas, Dll. 👋🏻
        </div>
    </footer>

    <script>
        const avatars = ['🦋', '🕷️', '🦈', '🐥', '🦓', '🦝', '🐻‍❄️', '🐺', '🐵', '🧕', '🧑🏻‍🜱'];
        function changeAvatar() { document.getElementById('avatar').textContent = avatars[Math.floor(Math.random() * avatars.length)]; }
        function openChat() { document.getElementById('start-chat-btn').classList.add('hidden'); document.getElementById('chat-interface').classList.remove('hidden'); }
        document.getElementById('theme-toggle').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); });
        document.getElementById('quote-text').textContent = `"Tetap semangat dan jaga kesehatan! 🏃‍♂️"`;
    </script>
</body>
</html>
